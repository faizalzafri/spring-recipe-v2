version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: recipe-postgres-v2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/sql-scripts/config.sql:/docker-entrypoint-initdb.d/01_config.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  spring-recipe-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring-recipe-v2-app
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=recipe_prod
      - DB_USER=recipe_prod_user
      - DB_PASSWORD=1234
      - JAVA_OPTS=-Xms256m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

volumes:
  postgres_data:
