version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: recipe-mysql-v2
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/sql-scripts/config.sql:/docker-entrypoint-initdb.d/01_config.sql:ro
      - ./src/main/resources/sql-scripts/recipe_database_create.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  spring-recipe-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring-recipe-v2-app
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=recipe_prod
      - DB_USER=recipe_prod_user
      - DB_PASSWORD=1234
      - JAVA_OPTS=-Xms256m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

volumes:
  mysql_data:
